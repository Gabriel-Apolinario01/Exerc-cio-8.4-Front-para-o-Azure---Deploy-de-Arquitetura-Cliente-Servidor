<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Compra Realizada</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0fdf4;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .receipt-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
        }

        .icon { font-size: 50px; margin-bottom: 10px; }

        h1 { color: #166534; font-size: 1.5rem; }

        .details {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px dashed #ccc;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="receipt-card" id="resultado-compra">
    <div class="icon">⏳</div>
    <h1>Processando pedido...</h1>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const idLivro = urlParams.get('id');

    if (idLivro !== null) {
        // Envia a requisição para efetivar a compra no back-end
        fetch(`http://127.0.0.1:5000/api/comprar/${idLivro}`)
            .then(resposta => resposta.json())
            .then(dados => {
                const card = document.getElementById('resultado-compra');

                if (dados.erro) {
                    card.innerHTML = `<h1 style="color: red;">Erro: ${dados.erro}</h1>
                                      <a href="index.html" class="back-link">Voltar para a loja</a>`;
                } else {
                    // Monta o recibo com o estilo bonito que você criou
                    card.innerHTML = `
                        <div class="icon">✅</div>
                        <h1>Pedido Confirmado!</h1>
                        <div class="details">
                            <p><strong>Livro:</strong> ${dados.livro.nome}</p>
                            <p><strong>Valor Pago:</strong> R$ ${parseFloat(dados.livro.preco).toFixed(2)}</p>
                        </div>
                        <p>${dados.mensagem}</p>
                        <div>
                            <a href="compras.html" class="back-link" style="margin-right: 15px;">Ir para o Histórico</a>
                            <a href="index.html" class="back-link">Voltar para a loja</a>
                        </div>
                    `;
                }
            })
            .catch(erro => console.error("Erro ao efetuar compra:", erro));
    } else {
        document.getElementById('resultado-compra').innerHTML = "<h1>Nenhum livro selecionado.</h1><a href='index.html' class='back-link'>Voltar para a loja</a>";
    }
</script>

</body>
</html>
